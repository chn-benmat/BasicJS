<!DOCTYPE html>
<html>

<head>
        <meta charset="utf-8">
        <title>DOM Modify</title>
        <style>
                .todo-title {
                        font-size: 20px;
                        border: 1px solid darkgray;
                        box-sizing: border-box;
                        width: 100%;
                        padding: 10px;
                }

                .add-todo {
                        font-size: 20px;
                        width: 100%;
                        padding: 10px;
                }

                .todo {
                        font-size: 20px;
                        background-color: gold;
                        border: 2px solid #333333;
                        box-sizing: border-box;
                        margin-bottom: 10px;
                        padding: 16px;
                        position: relative;
                }

                .remove-todo {
                        font-size: 16px;
                        position: absolute;
                        top: 6px;
                        right: 6px;
                }
        </style>
</head>

<body>
        <p>
                <input class="todo-title" type="text">
        </p>
        <p>
                <button class="add-todo" type="button">เพิ่ม</button>
        </p>
        <div class="todo-list"></div>
        <script src="script.js"></script>
</body>

</html>
