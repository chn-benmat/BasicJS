<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOM Style</title>
        <style>
                div {
                        border: 1px solid black;
                        padding: 10px;
                        margin-bottom: 10px;
                        font-size: 18px;
                }

                .message-2 {
                        display: none;
                        font-size: 18px;
                }

                .click-button {
                        padding: 10px;
                }
        </style>
</head>

<body>
        <div id="message-1" class="message-1">ข้อความที่ 1</div>
        <p>
                <button class="click-button">Click</button>
        </p>
        <div class="message-2">สวัสดี JavaScript</div>
        <script src="script.js"></script>
</body>

</html>
