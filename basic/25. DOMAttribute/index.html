<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOM Attribute</title>
        <style>
                .bird-image{
                width: 40%;
                }
                .js-link{
                        font-size: 24px;
                }
                .text-input{
                        font-size: 24px;

                        width: 40%;
                }
        </style>
</head>

<body>
        <p>
                <img src="https://images.unsplash.com/photo-1575845464737-a6ff42155569?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="Bird" class="bird-image">
        </p>
        <p>
                <a href="https://javascript.info/" target="_blank" class="js-link">JavaScript Info</a>
        </p>
        <p>
                <input type="text" class="text-input" value="สวัสดี JavaScript" hiddenMessage="สวัสดีน๊าบ">
        </p>
        <script src="script.js"></script>
</body>

</html>
